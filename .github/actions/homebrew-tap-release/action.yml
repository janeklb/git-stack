name: Homebrew Tap Release
description: Dispatch the Homebrew tap PR workflow for a published git-stack tag.

inputs:
  tag:
    description: Published git-stack tag to hand off
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch Homebrew tap PR workflow
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
      run: |
        gh api \
          --method POST \
          repos/janeklb/homebrew-tap/actions/workflows/git-stack-release-pr.yml/dispatches \
          -f ref=main \
          -f inputs[tag]="${{ inputs.tag }}"
