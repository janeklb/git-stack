name: Homebrew Tap Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Published git-stack tag to hand off"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-homebrew-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch workflow in homebrew-tap to create homebrew release PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          gh api \
            --method POST \
            repos/janeklb/homebrew-tap/actions/workflows/git-stack-release-pr.yml/dispatches \
            -f ref=main \
            -f inputs[tag]="$TAG"
