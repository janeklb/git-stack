name: Homebrew Tap Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Published git-stack tag to hand off"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-homebrew-tap-pr-via-release:
    if: github.event_name == 'release' && !github.event.release.draft
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Homebrew tap PR workflow via Release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        uses: ./.github/actions/homebrew-tap-release
        with:
          tag: ${{ github.event.release.tag_name }}
  dispatch-homebrew-tap-pr-via-workflow-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Homebrew tap PR workflow via Workflow Dispatch
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        uses: ./.github/actions/homebrew-tap-release
        with:
          tag: ${{ inputs.tag }}
